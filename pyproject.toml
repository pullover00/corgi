[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "object-consistent-masks"
version = "0.1.0"
description = "Object-consistent full target masks: a scene-change-detection pipeline for RGB-D image pairs"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy==1.26.4",
  "Pillow==10.4.0",
  "PyYAML==6.0.2",
  "scikit-image==0.24.0",
  "scipy==1.14.1",
  "tqdm==4.66.5",
]

[project.optional-dependencies]
models = [
  "torch==2.4.1",
  "torchvision==0.19.1",
  "huggingface-hub==0.25.2",
  "safetensors==0.4.5",
]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
]

[project.scripts]
ocmask = "ocmask.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocmask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
